<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DorkNet | Espace Client Premium</title>
    
    <!-- Feuilles de style externes -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 280px 1fr; 
            gap: 20px; 
            padding: 100px 20px 40px; 
            max-width: 1300px;
            margin: 0 auto;
        }
        .sidebar { 
            background: var(--bg-card, #1e293b); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color, #334155); 
            height: fit-content;
        }
        .main-content { 
            background: var(--bg-card, #1e293b); 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color, #334155); 
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        .status-badge { 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            display: inline-block;
            text-transform: uppercase;
        }
        .in_progress, .pending { 
            background: rgba(6, 182, 212, 0.2); 
            color: var(--accent-cyan, #06b6d4); 
        }
        .completed, .success { 
            background: rgba(16, 185, 129, 0.2); 
            color: var(--accent-green, #10b981); 
        }
        .audit-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        .audit-table th, .audit-table td { 
            padding: 14px 12px; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color, #334155); 
        }
        .progress-bar-bg {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-cyan, #06b6d4);
            transition: width 0.3s ease;
        }
        .btn-block {
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 868px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                padding-top: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-grid">
        <!-- Sidebar Espace Client -->
        <aside class="sidebar">
            <h3 id="companyName"><i class="fa-solid fa-building"></i> Chargement...</h3>
            <p style="color: var(--accent-green, #10b981); margin-top: 8px; font-size: 0.9rem;">
                <i class="fa-solid fa-shield-halved"></i> Compte Client DorkNet
            </p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color, #334155);">
            
            <button id="btnUpgradePremium" class="btn btn-primary btn-block">
                <i class="fa-solid fa-crown"></i> Passer en Premium
            </button>
            <button id="btnDownloadCertif" class="btn btn-outline btn-block">
                <i class="fa-solid fa-certificate"></i> Certificat CTF
            </button>
            <button id="btnLogout" class="btn btn-outline btn-block" style="border-color: #ef4444; color: #ef4444;">
                <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
            </button>
        </aside>

        <!-- Section Principale -->
        <main class="main-content">
            <h2>Suivi des Audits & Rapports de Vulnérabilités</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 5px;">
                Consultez l'état d'avancement des audits de sécurité et téléchargez vos livrables officiels.
            </p>

            <div class="table-responsive">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>Périmètre / Service</th>
                            <th>Statut</th>
                            <th>Avancement</th>
                            <th>Rapport Final</th>
                        </tr>
                    </thead>
                    <tbody id="auditRows">
                        <tr><td colspan="4">Chargement des données...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Script centralisé -->
    <script src="script.js"></script>
</body>
</html>
